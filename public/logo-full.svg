<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Icon -->
  <g transform="translate(20, 15)">
    <!-- Processor/Chip Border -->
    <rect x="40" y="40" width="60" height="60" rx="4" fill="none" stroke="#8B1538" stroke-width="4"/>
    
    <!-- Left Pins -->
    <rect x="20" y="57" width="10" height="5" fill="#8B1538"/>
    <rect x="20" y="73" width="10" height="5" fill="#8B1538"/>
    <rect x="20" y="89" width="10" height="5" fill="#8B1538"/>
    
    <!-- Right Pins -->
    <rect x="110" y="57" width="10" height="5" fill="#8B1538"/>
    <rect x="110" y="73" width="10" height="5" fill="#8B1538"/>
    <rect x="110" y="89" width="10" height="5" fill="#8B1538"/>
    
    <!-- Top Pins -->
    <rect x="57" y="20" width="5" height="10" fill="#8B1538"/>
    <rect x="72" y="20" width="5" height="10" fill="#8B1538"/>
    <rect x="87" y="20" width="5" height="10" fill="#8B1538"/>
    
    <!-- Bottom Pins -->
    <rect x="57" y="110" width="5" height="10" fill="#8B1538"/>
    <rect x="72" y="110" width="5" height="10" fill="#8B1538"/>
    <rect x="87" y="110" width="5" height="10" fill="#8B1538"/>
    
    <!-- Orange VT Text -->
    <text x="70" y="75" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFA500" text-anchor="middle">VT</text>
  </g>
  
  <!-- Text -->
  <text x="150" y="60" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#8B1538">VTLABS</text>
  <text x="150" y="95" font-family="Arial, sans-serif" font-size="18" fill="#8B1538" letter-spacing="2">GROUP</text>
  <text x="150" y="115" font-family="Arial, sans-serif" font-size="12" fill="#FFA500" font-style="italic">Vanguards technology</text>
</svg>
