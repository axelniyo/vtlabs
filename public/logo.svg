<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#FFFFFF"/>
  
  <!-- Processor/Chip Border -->
  <rect x="40" y="40" width="120" height="120" rx="8" fill="none" stroke="#8B1538" stroke-width="8"/>
  
  <!-- Left Pins -->
  <rect x="20" y="65" width="20" height="10" fill="#8B1538"/>
  <rect x="20" y="95" width="20" height="10" fill="#8B1538"/>
  <rect x="20" y="125" width="20" height="10" fill="#8B1538"/>
  
  <!-- Right Pins -->
  <rect x="160" y="65" width="20" height="10" fill="#8B1538"/>
  <rect x="160" y="95" width="20" height="10" fill="#8B1538"/>
  <rect x="160" y="125" width="20" height="10" fill="#8B1538"/>
  
  <!-- Top Pins -->
  <rect x="65" y="20" width="10" height="20" fill="#8B1538"/>
  <rect x="95" y="20" width="10" height="20" fill="#8B1538"/>
  <rect x="125" y="20" width="10" height="20" fill="#8B1538"/>
  
  <!-- Bottom Pins -->
  <rect x="65" y="160" width="10" height="20" fill="#8B1538"/>
  <rect x="95" y="160" width="10" height="20" fill="#8B1538"/>
  <rect x="125" y="160" width="10" height="20" fill="#8B1538"/>
  
  <!-- Orange VT Text -->
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#FFA500" text-anchor="middle">VT</text>
</svg>
